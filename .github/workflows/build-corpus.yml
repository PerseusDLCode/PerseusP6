name: Build corpus artifacts

# Freezes the whole site's pages in N parallel shards (see Dockerfile.corpus
# / `mvp-build --mode corpus-only --shard-index/--shard-count`), instead of
# the single combined build in Dockerfile/build.yml. Every shard's
# CORPORA_DIR contains *every* corpus (same as a full local checkout), so
# cross-corpus sibling/commentary lookups (mvp.site.siblings) resolve
# correctly no matter which shard a document's pages land in -- the shard
# split only decides which slice of the full, already-cross-referenced URL
# set each runner actually writes to disk (see build.py's URL-hash
# sharding). Splitting by corpus instead of by URL was tried first and
# reverted: these source repos don't partition cleanly by corpus (e.g.
# First1KGreek declares both greekLit and hebrewlit URNs, grcnewxml
# declares greekLit/itaLit/latinLit, canonical-pdlrefwk declares
# greekLit/latinLit/pdlrefwk), so a corpus-keyed split either duplicated or
# silently dropped pages depending on which corpus "won" a naming
# collision. Each shard pushes its own frozen-pages tarball + manifest.json
# as an OCI artifact to GHCR, tagged by a digest combining every corpus's
# HEAD SHA (a change to any corpus can affect any shard's cross-references,
# so all shards invalidate together); build-global.yml consumes the
# manifests to regenerate /, /collections/, /urn-index.json, /research/
# once any corpus changes.

on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Rebuild and push every shard even if the current combined corpus
          digest already has pushed artifacts. The skip check only keys on
          that combined digest, not on mvp-build's code — so a
          build-image/app.py-only change (no corpus content change) needs
          this to actually take effect.
        type: boolean
        default: false
  push:
    branches: [dev, main]
    paths:
      - Dockerfile.corpus
      - src/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read
  packages: write

env:
  # Number of parallel freeze shards (see matrix.shard below and build.py's
  # --shard-count). Raising this trades more GHA runner-minutes for shorter
  # wall-clock time per push; each shard still clones and catalogs every
  # corpus, so total compute scales with the corpus count, not with this.
  SHARD_COUNT: 5

jobs:
  # Fetches canonical-pdlrefwk (public repo — commentary-linking data every
  # shard needs, see Dockerfile.corpus) exactly once and shares it with
  # every matrix leg below via a build artifact, instead of each leg
  # re-cloning the same repo independently.
  fetch-pdlrefwk:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.pdlrefwk }}
    steps:
      - name: Resolve canonical-pdlrefwk HEAD SHA
        id: sha
        run: |
          SHA=$(git ls-remote https://github.com/PerseusDLCode/canonical-pdlrefwk refs/heads/dev | cut -f1)
          if [ -z "$SHA" ]; then
            echo "Could not resolve HEAD SHA for canonical-pdlrefwk@dev" >&2
            exit 1
          fi
          echo "pdlrefwk=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical-pdlrefwk
        uses: actions/checkout@v7
        with:
          repository: PerseusDLCode/canonical-pdlrefwk
          ref: dev
          path: canonical-pdlrefwk

      - name: Upload as a shared artifact
        uses: actions/upload-artifact@v7
        with:
          name: canonical-pdlrefwk
          path: canonical-pdlrefwk
          retention-days: 1

  # Fetches New Alexandria Commentaries (curated Markdown from three
  # opencommentaries.org repos, see src/tools/fetch_new_alexandria.py)
  # exactly once and shares it with every matrix leg below, for the same
  # reason as fetch-pdlrefwk above — only pages covering a passage one of
  # these commentaries annotates need it, but every shard would otherwise
  # redundantly hit GitHub for the same ~15 files.
  fetch-new-alexandria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --no-dev

      - name: Fetch New Alexandria Commentaries
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python src/tools/fetch_new_alexandria.py --out-dir new-alexandria

      - name: Upload as a shared artifact
        uses: actions/upload-artifact@v7
        with:
          name: new-alexandria
          path: new-alexandria
          retention-days: 1

  # Resolves every corpus's HEAD SHA once and combines them into one
  # digest, shared by every shard leg below. Splitting this out (rather
  # than each shard resolving its own five SHAs) means all five shards
  # agree on the same digest without racing independent `git ls-remote`
  # calls against a moving target.
  resolve-corpora-shas:
    runs-on: ubuntu-latest
    needs: [fetch-pdlrefwk]
    outputs:
      greeklit: ${{ steps.sha.outputs.greeklit }}
      latinlit: ${{ steps.sha.outputs.latinlit }}
      first1kgreek: ${{ steps.sha.outputs.first1kgreek }}
      nddlc: ${{ steps.sha.outputs.nddlc }}
      grcnewxml: ${{ steps.sha.outputs.grcnewxml }}
      combined: ${{ steps.combined.outputs.digest }}
    steps:
      - name: Resolve each corpus's HEAD SHA
        id: sha
        run: |
          declare -A repos=(
            [greeklit]="https://github.com/PerseusDL/canonical-greekLit master"
            [latinlit]="https://github.com/PerseusDL/canonical-latinLit master"
            [first1kgreek]="https://github.com/PerseusDLCode/First1KGreek editing"
            [nddlc]="https://github.com/PerseusDLCode/Notre-Dame-Digitized-Latin-Collection main"
            [grcnewxml]="https://github.com/gregorycrane/grcnewxml.git main"
          )
          for name in "${!repos[@]}"; do
            read -r url branch <<< "${repos[$name]}"
            sha=$(git ls-remote "$url" "refs/heads/${branch}" | cut -f1)
            if [ -z "$sha" ]; then
              echo "Could not resolve HEAD SHA for ${url}@${branch}" >&2
              exit 1
            fi
            echo "${name}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Compute combined digest
        id: combined
        run: |
          digest=$(printf '%s' \
            "${{ steps.sha.outputs.greeklit }}" \
            "${{ steps.sha.outputs.latinlit }}" \
            "${{ steps.sha.outputs.first1kgreek }}" \
            "${{ steps.sha.outputs.nddlc }}" \
            "${{ steps.sha.outputs.grcnewxml }}" \
            "${{ needs.fetch-pdlrefwk.outputs.sha }}" \
            | sha256sum | cut -d' ' -f1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build:
    needs: [fetch-pdlrefwk, fetch-new-alexandria, resolve-corpora-shas]
    runs-on: ubuntu-latest
    # Selects the GitHub Environment matching the triggering branch (dev or
    # main), so ${{ vars.MORPH_URL }} below resolves to that environment's
    # own MORPH_URL variable instead of a single repo-wide value.
    environment: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Download shared canonical-pdlrefwk artifact
        uses: actions/download-artifact@v8
        with:
          name: canonical-pdlrefwk
          path: canonical-pdlrefwk

      - name: Download shared New Alexandria Commentaries artifact
        uses: actions/download-artifact@v8
        with:
          name: new-alexandria
          path: new-alexandria

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Skip if this combined digest is already built
        id: skip
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true; rebuilding regardless of cached digest."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="ghcr.io/perseusdlcode/mvp-shard-${{ matrix.shard }}:${{ needs.resolve-corpora-shas.outputs.combined }}"
          if oras manifest fetch "$TAG" >/dev/null 2>&1; then
            echo "Already built: $TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Pulled unconditionally as :latest per corpus (see mvp-tokenization's
      # tokenize-corpus.yml, dispatched manually/separately from this
      # workflow, not on every corpus SHA) -- not every corpus has been
      # through that workflow yet, so a missing artifact just leaves that
      # corpus's slice of tokenized-pages/ empty rather than failing the
      # build. Every shard needs every corpus's tokens now (any shard can
      # contain any corpus's pages), so this loops over all five and
      # extracts them into the same directory -- each corpus's archive
      # nests under its own corpus segment (mirroring PROTO_DIR's layout),
      # so they merge rather than collide. Dockerfile.corpus's COPY
      # tolerates an empty/partial directory, and the reading view renders
      # fine without token sidecars.
      - name: Fetch tokens artifacts
        if: steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p tokenized-pages
          for tag_name in greeklit latinlit first1kgreek nd-dlc grcnewxml; do
            if oras pull "ghcr.io/perseusdlcode/mvp-tokens-${tag_name}:latest"; then
              tar --zstd -xf tokens.tar.zst -C tokenized-pages
              rm tokens.tar.zst
            else
              echo "No tokens artifact yet for ${tag_name}; building without its token sidecars."
            fi
          done

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build shard builder image (not pushed — see file header)
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.corpus
          push: false
          load: true
          tags: mvp-shard-builder:${{ matrix.shard }}
          build-args: |
            GREEKLIT_SHA=${{ needs.resolve-corpora-shas.outputs.greeklit }}
            LATINLIT_SHA=${{ needs.resolve-corpora-shas.outputs.latinlit }}
            FIRST1KGREEK_SHA=${{ needs.resolve-corpora-shas.outputs.first1kgreek }}
            NDDLC_SHA=${{ needs.resolve-corpora-shas.outputs.nddlc }}
            GRCNEWXML_SHA=${{ needs.resolve-corpora-shas.outputs.grcnewxml }}
          # Shared across every shard (not scoped per-shard): all five
          # shards clone the identical set of corpora, so they should all
          # hit the same Docker layer cache instead of each populating and
          # reusing only its own copy.
          cache-from: type=gha,scope=corpus-all
          cache-to: type=gha,mode=max,scope=corpus-all

      # ---------------------------------------------------------- #
      # Run the freeze. manifest.json is written inside FREEZER_
      # DESTINATION (see build() in app.py), so the one bind mount
      # below captures both the frozen pages and the manifest. Token
      # sidecars are no longer bind-mounted here — they're checked into
      # the repo under tokenized-pages/ and baked into the image by
      # Dockerfile.corpus.
      # ---------------------------------------------------------- #
      - name: Run sharded corpus-only build
        if: steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p "$PWD/out"
          docker run --rm \
            -e MORPH_URL="${{ vars.MORPH_URL }}" \
            -v "$PWD/out:/app/build" \
            -v "$PWD/new-alexandria:/app/new-alexandria:ro" \
            mvp-shard-builder:${{ matrix.shard }} \
            --source-digest "${{ needs.resolve-corpora-shas.outputs.combined }}" \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ env.SHARD_COUNT }}

      - name: Pull manifest.json out of the pages tree
        if: steps.skip.outputs.skip != 'true'
        run: mv out/manifest.json manifest.json

      - name: Package frozen pages
        if: steps.skip.outputs.skip != 'true'
        run: tar --zstd -cf pages.tar.zst -C out .

      # ---------------------------------------------------------- #
      # Two artifacts per shard: the (large) pages tarball, and the
      # (tiny) manifest, tagged separately so build-global.yml never
      # has to pull page content just to read a manifest.
      # ---------------------------------------------------------- #
      - name: Push pages artifact
        if: steps.skip.outputs.skip != 'true'
        run: |
          oras push "ghcr.io/perseusdlcode/mvp-shard-${{ matrix.shard }}:${{ needs.resolve-corpora-shas.outputs.combined }}" \
            pages.tar.zst:application/vnd.perseus.mvp.pages

      - name: Push manifest artifact
        if: steps.skip.outputs.skip != 'true'
        run: |
          oras push "ghcr.io/perseusdlcode/mvp-shard-${{ matrix.shard }}-manifest:${{ needs.resolve-corpora-shas.outputs.combined }}" \
            manifest.json:application/vnd.perseus.mvp.manifest+json

      # ---------------------------------------------------------- #
      # Point this branch's alias (main -> latest = production,
      # dev -> staging) at the digest-tagged artifact. Runs whenever
      # the digest-tagged artifact exists in GHCR — whether it was
      # just pushed above, or already existed from the other branch
      # resolving the same combined digest (see the "Skip if already
      # built" step) — so a skipped build still moves this branch's
      # alias forward instead of leaving it stale.
      # ---------------------------------------------------------- #
      - name: Tag pages/manifest artifacts with this branch's alias
        run: |
          ALIAS="${{ github.ref_name == 'main' && 'latest' || 'staging' }}"
          oras tag "ghcr.io/perseusdlcode/mvp-shard-${{ matrix.shard }}:${{ needs.resolve-corpora-shas.outputs.combined }}" "$ALIAS"
          oras tag "ghcr.io/perseusdlcode/mvp-shard-${{ matrix.shard }}-manifest:${{ needs.resolve-corpora-shas.outputs.combined }}" "$ALIAS"

  # Publishes SHARD_COUNT as its own tiny artifact so cron-deploy.sh can
  # verify each deploy host's SHARDS matches it before deploying — without
  # this, bumping SHARD_COUNT above without updating every deploy host's
  # SHARDS would silently deploy a site missing whichever shards that host
  # never fetches. Runs once per workflow run (not once per matrix leg,
  # unlike the per-shard alias tag above), and only after every leg of
  # `build` has succeeded — if a leg fails, the previous count stays
  # published rather than getting overwritten with an unverified one.
  publish-shard-count:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Push shard count
        run: |
          ALIAS="${{ github.ref_name == 'main' && 'latest' || 'staging' }}"
          printf '%s' "${{ env.SHARD_COUNT }}" > shard-count.txt
          oras push "ghcr.io/perseusdlcode/mvp-shard-count:${ALIAS}" \
            shard-count.txt:text/plain
