name: Build global pages

# Regenerates the four corpus-independent pages (/, /collections/,
# /urn-index.json, /research/) from the three corpora's manifest.json
# artifacts (see build-corpus.yml / `mvp-build --mode global-only`).
# Deliberately pulls only the small manifest artifacts, never the (much
# larger) per-corpus page tarballs — see _merge_manifests in app.py.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build corpus artifacts"]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ---------------------------------------------------------- #
      # Mirrors build-corpus.yml's main->latest (production) /
      # dev->staging alias split. For a workflow_run trigger, the
      # branch that matters is the *upstream* build-corpus run's
      # branch (head_branch), not this workflow's own ref; for a
      # manual workflow_dispatch, fall back to whichever branch was
      # selected to run it from (github.ref_name).
      # ---------------------------------------------------------- #
      - name: Determine triggering branch and artifact alias
        id: ctx
        run: |
          BRANCH="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then ALIAS=latest; else ALIAS=staging; fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.branch }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install project (no corpus data needed for a global-only build)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --no-dev

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Pull each shard's manifest
        id: manifests
        run: |
          mkdir -p manifests
          args=""
          # build-corpus.yml now freezes N URL-hashed shards rather than one
          # leg per corpus (see that workflow's header comment) -- every
          # shard's manifest already covers every corpus's collections
          # (each shard's CORPORA_DIR holds all of them), so these five are
          # redundant with each other and get deduped by _merge_manifests.
          for shard in 0 1 2 3 4; do
            oras pull "ghcr.io/perseusdlcode/mvp-shard-${shard}-manifest:${{ steps.ctx.outputs.alias }}" \
              -o "manifests/shard-${shard}"
            args="${args} --manifest manifests/shard-${shard}/manifest.json"
          done
          echo "manifest_args=${args}" >> "$GITHUB_OUTPUT"

      - name: Run global-only build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mvp-build --mode global-only ${{ steps.manifests.outputs.manifest_args }}

      - name: Compute combined digest
        id: digest
        run: |
          DIGEST=$(cat manifests/*/manifest.json | sha256sum | cut -d' ' -f1)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Package and push global pages
        run: |
          tar --zstd -cf global.tar.zst -C build .
          oras push "ghcr.io/perseusdlcode/mvp-global:${{ steps.digest.outputs.digest }}" \
            global.tar.zst:application/vnd.perseus.mvp.pages
          oras tag "ghcr.io/perseusdlcode/mvp-global:${{ steps.digest.outputs.digest }}" "${{ steps.ctx.outputs.alias }}"
